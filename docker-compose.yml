services:
  db:
    image: postgres:16
    container_name: dantes-db
    environment:
      POSTGRES_USER: dental_app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: dental_platform
    ports:
      - "5432:5432"
    volumes:
      - dental_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental_app -d dental_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dental_pg:
